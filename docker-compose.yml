version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: de27four_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-de27four}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-de27four_pw}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio_analytics}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-de27four}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Separate from the `postgres` service above so integration tests never
  # touch dev data: a distinct DB name/user and a distinct host port
  # (5433) so it can run alongside `postgres` on 5432 at the same time.
  # tests/integration/conftest.py's pg_engine fixture reads
  # TEST_DATABASE_URL, which should point at this service.
  postgres_test:
    image: postgres:16
    container_name: de27four_postgres_test
    environment:
      POSTGRES_USER: de27four_test
      POSTGRES_PASSWORD: de27four_test_pw
      POSTGRES_DB: portfolio_analytics_test
    ports:
      - "5433:5432"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U de27four_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: de27four_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-de27four}:${POSTGRES_PASSWORD:-de27four_pw}@postgres:5432/${POSTGRES_DB:-portfolio_analytics}
    volumes:
      - ./:/app
    command: ["python", "-m", "src.orchestration.run_pipeline"]

  scheduler:
    build: .
    container_name: de27four_scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-de27four}:${POSTGRES_PASSWORD:-de27four_pw}@postgres:5432/${POSTGRES_DB:-portfolio_analytics}
      PIPELINE_SCHEDULE: ${PIPELINE_SCHEDULE:-0 18 * * 1-5}
      SCHEDULER_TIMEZONE: ${SCHEDULER_TIMEZONE:-Africa/Johannesburg}
    volumes:
      - ./:/app
    command: ["python", "-m", "src.orchestration.scheduler"]

volumes:
  pgdata: